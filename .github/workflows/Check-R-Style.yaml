name: Check R Style

on:
  push:
    paths:
      - "**/*.R"
  pull_request:
    paths:
      - "**/*.R"

jobs:
  style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::styler

      - name: Check style
        run: |
          Rscript -e '
          # Check for style issues
          styled <- styler::style_pkg(dry = "on")
          
          # If any files have changes, report them and fail
          if (any(styled$changed)) {
            changed_files <- styled[styled$changed, "file"]
            cat("\nStyle issues found in the following files:\n")
            cat(paste(changed_files, collapse = "\n"), "\n")
            quit(status = 1)
          } else {
            cat("\nNo style issues found! 🎉\n")
          }'
